# 안드로이드 APK 를 빌드해서 Firebase App Distribution 으로 팀·테스터 폰에 보낸다.
# 설정 방법: docs/안드로이드_자동배포.md  (Secrets 9개를 팀 저장소에 등록해야 돈다)
name: Android → Firebase

on:
  push:
    branches: [main, feature/android-support]
    paths:
      - 'My project/Assets/**'
      - 'My project/Packages/**'
      - 'My project/ProjectSettings/**'
      - '.github/workflows/android-firebase.yml'
  workflow_dispatch:
    inputs:
      notes:
        description: '테스터에게 보일 메모 (비우면 커밋 메시지)'
        required: false

# 같은 브랜치에 새로 올라오면 이전 빌드는 멈춘다 (빌드 시간 절약)
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROJECT_PATH: My project
      TESTER_GROUPS: kuca-team
    steps:
      - name: Secrets 확인
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          missing=""
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASS \
                      ANDROID_KEYALIAS_NAME ANDROID_KEYALIAS_PASS FIREBASE_APP_ID FIREBASE_SERVICE_ACCOUNT; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::등록되지 않은 Secrets:$missing — docs/안드로이드_자동배포.md 1장 ⑥ 참고"
            exit 1
          fi

      # Unity 안드로이드 이미지가 커서 기본 러너 디스크가 모자랄 수 있다
      - name: 디스크 비우기
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          tool-cache: false
          large-packages: false

      - uses: actions/checkout@v6

      - name: Library 캐시
        uses: actions/cache@v5
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-Android-${{ hashFiles('My project/Packages/packages-lock.json', 'My project/ProjectSettings/ProjectVersion.txt') }}-${{ github.sha }}
          restore-keys: |
            Library-Android-${{ hashFiles('My project/Packages/packages-lock.json', 'My project/ProjectSettings/ProjectVersion.txt') }}-
            Library-Android-

      - name: Unity 빌드 (APK)
        id: unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: Android
          buildName: KUCA
          # 버전은 실행 번호로 자동 증가 → 테스터 폰에서 "업데이트"로 설치된다
          versioning: Custom
          version: 0.1.${{ github.run_number }}
          androidVersionCode: ${{ github.run_number }}
          androidExportType: androidPackage
          # 매번 같은 키로 서명해야 덮어쓰기 설치가 된다 (키가 바뀌면 지우고 다시 설치해야 함)
          androidKeystoreName: kuca.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: APK 찾기
        id: apk
        run: |
          apk=$(find build/Android -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then echo "::error::APK 가 만들어지지 않았습니다"; exit 1; fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          ls -lh "$apk"

      # Firebase 가 막혀도 Actions 탭에서 내려받을 수 있게 남겨 둔다
      - name: APK 보관 (14일)
        uses: actions/upload-artifact@v6
        with:
          name: KUCA-${{ github.ref_name }}-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Firebase App Distribution 으로 보내기
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          INPUT_NOTES: ${{ github.event.inputs.notes }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          key="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          export GOOGLE_APPLICATION_CREDENTIALS="$key"

          notes="$RUNNER_TEMP/notes.txt"
          {
            echo "KUCA 0.1.${{ github.run_number }} · ${{ github.ref_name }} · ${GITHUB_SHA::7}"
            if [ -n "$INPUT_NOTES" ]; then echo "$INPUT_NOTES"; else echo "$COMMIT_MSG" | head -n 5; fi
          } > "$notes"

          npx --yes firebase-tools@15 appdistribution:distribute "$APK" \
            --app "$FIREBASE_APP_ID" \
            --groups "$TESTER_GROUPS" \
            --release-notes-file "$notes"

          rm -f "$key"
